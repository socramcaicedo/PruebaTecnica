<div class="flex flex-col gap-1">
  <label class="text-sm font-medium text-gray-300">{{ label() }}</label>

  @if (loading()) {
    <div class="h-10 bg-gray-200 rounded animate-pulse"></div>
  } @else {
    <select
      class="h-10 px-3 rounded-lg border border-gray-600 bg-gray-800 text-white text-sm
             focus:outline-none focus:ring-2 focus:ring-green-400 transition-colors
             disabled:opacity-50 disabled:cursor-not-allowed"
      [disabled]="disabled()"
      [value]="value() ?? ''"
      (change)="onChange($event)">
      <option value="" disabled>{{ placeholder() }}</option>
      @for (opt of options(); track opt.value) {
        <option [value]="opt.value">{{ opt.label }}</option>
      }
    </select>
  }
</div>
